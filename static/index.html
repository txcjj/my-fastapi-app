<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>餐饮店进销存系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f4f6f8; color: #333; padding-bottom: 70px; }
  header { background: #2c3e50; color: #fff; padding: 15px; font-size: 18px; font-weight: bold; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
  header small { font-size: 12px; opacity: 0.8; font-weight: normal; }
  .container { padding: 12px; }
  .page-content { display: none; }
  .page-content.active { display: block; }
  
  /* 卡片样式 */
  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
  .card { background: #fff; border-radius: 10px; padding: 15px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card .num { font-size: 22px; font-weight: bold; color: #2c3e50; margin-top: 5px; }
  .card .label { font-size: 12px; color: #888; }
  .card.warn .num { color: #e74c3c; }
  
  /* 表格样式 */
  .table-wrap { overflow-x: auto; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 100%; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
  th { background: #fafafa; color: #666; font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  td.warn-text { color: #e74c3c; font-weight: bold; }
  
  /* 标题与按钮 */
  .section-title { font-size: 15px; font-weight: bold; margin: 15px 0 8px; color: #2c3e50; display: flex; justify-content: space-between; align-items: center; }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; border: none; background: #2c3e50; color: #fff; }
  .btn-sm.primary { background: #27ae60; }
  .btn-sm.warn { background: #e74c3c; }
  
  /* 底部导航栏 */
  .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #fff; display: flex; border-top: 1px solid #eee; z-index: 50; }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #888; cursor: pointer; }
  .tab-item.active { color: #2c3e50; font-weight: bold; }
  .tab-item .icon { font-size: 20px; margin-bottom: 2px; }

  /* 弹窗 */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center; padding: 15px; }
  .modal.show { display: flex; }
  .modal-box { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
  .modal-box h3 { margin-bottom: 15px; font-size: 16px; }
  .form-row { margin-bottom: 10px; }
  .form-row label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
  .form-row input, .form-row select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
  .modal-actions button { flex: 1; padding: 11px; border: none; border-radius: 8px; font-size: 14px; }
  .btn-primary { background: #2c3e50; color: #fff; }
  .btn-cancel { background: #eee; color: #333; }
  
  .empty { text-align: center; color: #aaa; padding: 30px 0; font-size: 13px; }
</style>
</head>
<body>

<header>
  <span>🛒 餐饮店进销存</span>
  <small id="store-label">门店ID: 1</small>
</header>

<div class="container">
  <!-- 1. 数据看板 -->
  <div id="page-dashboard" class="page-content active">
    <div class="cards">
      <div class="card">
        <div class="label">今日营收</div>
        <div class="num" id="stat-revenue">¥0.00</div>
      </div>
      <div class="card">
        <div class="label">今日税前利润</div>
        <div class="num" id="stat-profit">¥0.00</div>
      </div>
      <div class="card warn">
        <div class="label">库存预警</div>
        <div class="num" id="stat-warn">0 项</div>
      </div>
      <div class="card">
        <div class="label">原材料种类</div>
        <div class="num" id="stat-materials">0</div>
      </div>
    </div>
    <div class="section-title">快捷操作</div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn-sm primary" onclick="switchPage('master')">➕ 新增原材料</button>
      <button class="btn-sm primary" onclick="switchPage('inventory')">📦 查看库存</button>
      <button class="btn-sm primary" onclick="switchPage('reports')">📊 查看报表</button>
    </div>
  </div>

  <!-- 2. 基础数据（原材料） -->
  <div id="page-master" class="page-content">
    <div class="section-title">
      <span>原材料管理</span>
      <button class="btn-sm primary" onclick="openMaterialModal()">+ 新增</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>名称</th><th>单位</th><th>安全库存</th><th>最新进价</th><th>操作</th></tr>
        </thead>
        <tbody id="material-body">
          <tr><td colspan="5" class="empty">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 3. 库存中心 -->
  <div id="page-inventory" class="page-content">
    <div class="section-title">
      <span>实时库存</span>
      <button class="btn-sm warn" onclick="loadInventoryWarning()">仅看预警</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>原材料</th><th>仓库</th><th>当前库存</th><th>加权成本</th></tr>
        </thead>
        <tbody id="inventory-body">
          <tr><td colspan="4" class="empty">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 4. 财务报表 -->
  <div id="page-reports" class="page-content">
    <div class="section-title">最近营收报表（近30天）</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>日期</th><th>总营收</th><th>总单数</th></tr>
        </thead>
        <tbody id="report-revenue-body">
          <tr><td colspan="3" class="empty">加载中...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="section-title">最近利润报表（近30天）</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>日期</th><th>营收</th><th>成本</th><th>税前利润</th></tr>
        </thead>
        <tbody id="report-profit-body">
          <tr><td colspan="4" class="empty">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="tab-bar">
  <div class="tab-item active" id="tab-dashboard" onclick="switchPage('dashboard')">
    <span class="icon">📊</span>看板
  </div>
  <div class="tab-item" id="tab-master" onclick="switchPage('master')">
    <span class="icon">📋</span>基础数据
  </div>
  <div class="tab-item" id="tab-inventory" onclick="switchPage('inventory')">
    <span class="icon">📦</span>库存
  </div>
  <div class="tab-item" id="tab-reports" onclick="switchPage('reports')">
    <span class="icon">📈</span>报表
  </div>
</div>

<!-- 原材料新增/编辑弹窗 -->
<div class="modal" id="material-modal">
  <div class="modal-box">
    <h3 id="material-modal-title">新增原材料</h3>
    <input type="hidden" id="m-id">
    <div class="form-row"><label>原材料名称 *</label><input id="m-name" placeholder="如：大米"></div>
    <div class="form-row"><label>基本单位</label><input id="m-unit" value="kg"></div>
    <div class="form-row"><label>安全库存量</label><input id="m-safety" type="number" step="0.01" value="10"></div>
    <div class="form-row"><label>最新采购价（¥）</label><input id="m-price" type="number" step="0.01" value="0"></div>
    <div class="form-row"><label>保质期（天）</label><input id="m-shelf" type="number" value="0"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeMaterialModal()">取消</button>
      <button class="btn-primary" onclick="saveMaterial()">保存</button>
    </div>
  </div>
</div>

<script>
const API_BASE = "";
const STORE_ID = 1; // 当前门店ID，默认1

// ============ 通用请求 ============
async function apiFetch(url, options = {}) {
  try {
    const res = await fetch(API_BASE + url, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    if (!res.ok) throw new Error(await res.text() || '请求失败');
    return await res.json();
  } catch (e) {
    if (e.message.includes('Failed to fetch') || e.name === 'TypeError') {
      alert('服务器正在唤醒，请等 30-60 秒后重试...');
    } else {
      alert('请求失败：' + e.message);
    }
    throw e;
  }
}

// ============ 页面切换 ============
const pages = ['dashboard', 'master', 'inventory', 'reports'];
function switchPage(page) {
  pages.forEach(p => {
    document.getElementById('page-' + p).classList.toggle('active', p === page);
    document.getElementById('tab-' + p).classList.toggle('active', p === page);
  });
  if (page === 'dashboard') loadDashboard();
  if (page === 'master') loadMaterials();
  if (page === 'inventory') loadInventory();
  if (page === 'reports') loadReports();
}

// ============ 1. 看板 ============
async function loadDashboard() {
  try {
    const d = await apiFetch(`/api/dashboard?store_id=${STORE_ID}`);
    document.getElementById('stat-revenue').textContent = '¥' + Number(d.today_revenue).toFixed(2);
    document.getElementById('stat-profit').textContent = '¥' + Number(d.today_profit).toFixed(2);
    document.getElementById('stat-warn').textContent = d.warn_count + ' 项';
    document.getElementById('stat-materials').textContent = d.total_materials;
  } catch (e) { /* 忽略 */ }
}

// ============ 2. 原材料 ============
async function loadMaterials() {
  const tbody = document.getElementById('material-body');
  tbody.innerHTML = '<tr><td colspan="5" class="empty">加载中...</td></tr>';
  try {
    const list = await apiFetch(`/api/materials?store_id=${STORE_ID}`);
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无原材料</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(m => `
      <tr>
        <td>${m.name}</td>
        <td>${m.unit || '-'}</td>
        <td>${m.safety_stock || 0}</td>
        <td>¥${Number(m.latest_purchase_price || 0).toFixed(2)}</td>
        <td>
          <button class="btn-sm" onclick='editMaterial(${JSON.stringify(m)})'>改</button>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">加载失败</td></tr>';
  }
}

function openMaterialModal() {
  document.getElementById('material-modal').classList.add('show');
  document.getElementById('material-modal-title').textContent = '新增原材料';
  document.getElementById('m-id').value = '';
  document.getElementById('m-name').value = '';
  document.getElementById('m-unit').value = 'kg';
  document.getElementById('m-safety').value = 10;
  document.getElementById('m-price').value = 0;
  document.getElementById('m-shelf').value = 0;
}

function editMaterial(m) {
  document.getElementById('material-modal').classList.add('show');
  document.getElementById('material-modal-title').textContent = '编辑原材料';
  document.getElementById('m-id').value = m.id;
  document.getElementById('m-name').value = m.name;
  document.getElementById('m-unit').value = m.unit || 'kg';
  document.getElementById('m-safety').value = m.safety_stock || 0;
  document.getElementById('m-price').value = m.latest_purchase_price || 0;
  document.getElementById('m-shelf').value = m.shelf_life_days || 0;
}

function closeMaterialModal() {
  document.getElementById('material-modal').classList.remove('show');
}

async function saveMaterial() {
  const id = document.getElementById('m-id').value;
  const payload = {
    store_id: STORE_ID,
    name: document.getElementById('m-name').value.trim(),
    unit: document.getElementById('m-unit').value.trim() || 'kg',
    safety_stock: Number(document.getElementById('m-safety').value) || 0,
    latest_purchase_price: Number(document.getElementById('m-price').value) || 0,
    shelf_life_days: Number(document.getElementById('m-shelf').value) || 0,
  };
  if (!payload.name) { alert('请填写名称'); return; }

  const url = id ? `/api/materials/${id}` : '/api/materials';
  const method = id ? 'PUT' : 'POST';
  await apiFetch(url, { method, body: JSON.stringify(payload) });
  closeMaterialModal();
  loadMaterials();
}

// ============ 3. 库存 ============
async function loadInventory() {
  const tbody = document.getElementById('inventory-body');
  tbody.innerHTML = '<tr><td colspan="4" class="empty">加载中...</td></tr>';
  try {
    const list = await apiFetch(`/api/inventory?store_id=${STORE_ID}`);
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">暂无库存数据</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(i => `
      <tr>
        <td>${i.material_name || i.material_id}</td>
        <td>${i.warehouse_name || i.warehouse_id}</td>
        <td class="${i.quantity <= i.safety_stock ? 'warn-text' : ''}">${i.quantity}</td>
        <td>¥${Number(i.avg_cost || 0).toFixed(2)}</td>
      </tr>
    `).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">加载失败</td></tr>';
  }
}

async function loadInventoryWarning() {
  const tbody = document.getElementById('inventory-body');
  tbody.innerHTML = '<tr><td colspan="4" class="empty">加载中...</td></tr>';
  try {
    const list = await apiFetch(`/api/inventory/warning?store_id=${STORE_ID}`);
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">没有预警项 🎉</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(i => `
      <tr>
        <td>${i.material_name}</td>
        <td>${i.material_unit || '-'}</td>
        <td class="warn-text">${i.quantity}</td>
        <td>安全: ${i.safety_stock}</td>
      </tr>
    `).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">加载失败</td></tr>';
  }
}

// ============ 4. 报表 ============
async function loadReports() {
  // 营收
  const revBody = document.getElementById('report-revenue-body');
  revBody.innerHTML = '<tr><td colspan="3" class="empty">加载中...</td></tr>';
  try {
    const revList = await apiFetch(`/api/reports/revenue_daily?store_id=${STORE_ID}`);
    if (!revList.length) {
      revBody.innerHTML = '<tr><td colspan="3" class="empty">暂无数据</td></tr>';
    } else {
      revBody.innerHTML = revList.map(r => `
        <tr>
          <td>${r.revenue_date}</td>
          <td>¥${Number(r.total_revenue).toFixed(2)}</td>
          <td>${r.total_orders}</td>
        </tr>
      `).join('');
    }
  } catch (e) { revBody.innerHTML = '<tr><td colspan="3" class="empty">加载失败</td></tr>'; }

  // 利润
  const profitBody = document.getElementById('report-profit-body');
  profitBody.innerHTML = '<tr><td colspan="4" class="empty">加载中...</td></tr>';
  try {
    const profitList = await apiFetch(`/api/reports/profit_daily?store_id=${STORE_ID}`);
    if (!profitList.length) {
      profitBody.innerHTML = '<tr><td colspan="4" class="empty">暂无数据</td></tr>';
    } else {
      profitBody.innerHTML = profitList.map(p => `
        <tr>
          <td>${p.profit_date}</td>
          <td>¥${Number(p.revenue).toFixed(2)}</td>
          <td>¥${Number(p.cost).toFixed(2)}</td>
          <td class="${p.pretax_profit >= 0 ? '' : 'warn-text'}">¥${Number(p.pretax_profit).toFixed(2)}</td>
        </tr>
      `).join('');
    }
  } catch (e) { profitBody.innerHTML = '<tr><td colspan="4" class="empty">加载失败</td></tr>'; }
}

// ============ 初始化 ============
window.addEventListener('load', () => {
  loadDashboard();
});
</script>
</body>
</html>
